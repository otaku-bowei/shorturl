spring:
  application:
    name: shorturl

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  # MySQL 配置
  datasource:
    url: jdbc:mysql://localhost:3306/shorturl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: IboTxData5566
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

# 短链配置
shorturl:
  domain: http://localhost:8080
  id-gen:
    start: 100000
  cache:
    prefix: 'short:url:'
    default-expire-days: 7
